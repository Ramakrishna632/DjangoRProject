{% extends "base.html" %}
{% load static %}
{% block title %}Share{% endblock %}
{% block extra_css %}
<style>
body{background:#5f8fe3}
.top-bar{background:#5f8fe3;color:#fff;text-align:center;padding:14px;font-size:18px;font-weight:600}
.hero img{width:100%;height:200px;object-fit:cover}
.card{background:#fff;margin:-40px 15px 15px;border-radius:16px;padding:15px;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.copy-box{display:flex;margin-bottom:12px}
.copy-box input{flex:1;padding:10px;border:1px solid #ddd;border-radius:8px 0 0 8px;font-size:13px;background:#f5f7ff}
.copy-box button{padding:10px 14px;border:none;background:#5f8fe3;color:#fff;border-radius:0 8px 8px 0;cursor:pointer;font-size:14px}
.note{text-align:center;font-size:14px;color:#444;margin:15px 0}
.levels{border:1px solid #eee;border-radius:10px;overflow:hidden}
.level{display:flex;justify-content:space-between;padding:12px;font-size:14px;border-bottom:1px solid #eee}
.level:last-child{border-bottom:none}
.level.active{background:#e8f0ff}
</style>
{% endblock %}

{% block content %}

<div class="top-bar"><br>
  <i class="fas fa-arrow-left" onclick="history.back()" style="cursor:pointer"></i>
  Go back
</div>

<div class="top-bar">Share</div>

<div class="hero">
  
</div>

<div class="card">
  <!-- Referral link -->
  <div class="copy-box">
    <input type="text" id="linkVal" value="{{ request.scheme }}://{{ request.get_host }}/register/?ref={{ profile.referral_code }}" readonly>
    <button onclick="copyField('linkVal',this)">Copy</button>
  </div>

  <!-- Referral code -->
  <div class="copy-box">
    <input type="text" id="codeVal" value="{{ profile.referral_code }}" readonly>
    <button onclick="copyField('codeVal',this)">Copy</button>
  </div>

  <p class="note">Share this link and earn 25% of your team's income!</p>

  <div class="levels">
    <div class="level active"><span>LV - 1</span><span>25%</span></div>
    <div class="level"><span>LV - 2</span><span>3%</span></div>
    <div class="level"><span>LV - 3</span><span>2%</span></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function copyField(id, btn) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value).then(()=>{
    btn.textContent = 'Copied!';
    setTimeout(()=>btn.textContent='Copy', 1500);
  });
}
</script>
{% endblock %}
