<!DOCTYPE html>
<html lang="en">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Stryker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298, #6f97ff);
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      max-width: 380px;
      width: 90%;
      background: #fff;
      padding: 35px 28px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 6px;
    }
    .login-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg,#6f97ff,#1e3c72);
      object-fit: cover;
      border: 3px solid #e8efff;
    }
    h2 {
      text-align: center;
      color: #1e3c72;
      font-size: 22px;
      margin: 10px 0 22px;
    }
    input[type=text],
    input[type=password] {
      width: 100%;
      padding: 13px 16px;
      margin-top: 14px;
      border-radius: 10px;
      border: 1.5px solid #dde0e8;
      font-size: 15px;
      background: #f7f8fc;
      outline: none;
      display: block;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #6f97ff;
      background: #fff;
    }
    .password-box {
      position: relative;
      margin-top: 14px;
    }
    .password-box input {
      width: 100%;
      padding: 13px 44px 13px 16px;
      border-radius: 10px;
      border: 1.5px solid #dde0e8;
      font-size: 15px;
      background: #f7f8fc;
      outline: none;
      margin-top: 0;
      transition: border-color 0.2s;
    }
    .password-box input:focus {
      border-color: #6f97ff;
      background: #fff;
    }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #888;
      padding: 0;
    }
    .submit-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #1e3c72, #6f97ff);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(111,151,255,0.35);
      transition: opacity 0.2s, transform 0.1s;
    }
    .submit-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(0); }
    .switch-link {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #666;
    }
    .switch-link a {
      color: #1e3c72;
      font-weight: 700;
      text-decoration: none;
    }
    .switch-link a:hover { text-decoration: underline; }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 0;
      color: #bbb;
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #eee;
    }
  </style>
</head>
<body>

<div class="box">
  <div class="logo-wrap">
<img src="{% static 'stryker.png' %}" class="login-logo">
</div>

  <h2>Stryker</h2>

 <form method="POST" action="">
  {% csrf_token %}

  <input type="text" name="mobile" placeholder="Mobile Number" maxlength="10">

  <div class="password-box">
    <input type="password" name="password" id="password" placeholder="Password">
    <button type="button" class="eye-btn" onclick="togglePwd()">👁</button>
  </div>

  <button type="submit" class="submit-btn">Login</button>
</form>

  <div class="divider">or</div>

  <p class="switch-link" style="margin-top:14px">
    Don't have an account? <a href="{% url 'register' %}">Register</a>
  </p>
</div>

<script>
function togglePwd() {
  var x = document.getElementById("password");
  x.type = x.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
