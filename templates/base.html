{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}Stryker{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>
    <i class="fas fa-home"></i><span>Home</span>
  </a>
  <a href="{% url 'income' %}" {% if request.resolver_match.url_name == 'income' %}class="active"{% endif %}>
    <i class="fas fa-wallet"></i><span>Income</span>
  </a>
  <a href="{% url 'team' %}" {% if request.resolver_match.url_name == 'team' %}class="active"{% endif %}>
    <i class="fas fa-users"></i><span>Team</span>
  </a>
  
  <a href="{% url 'my_profile' %}" {% if request.resolver_match.url_name == 'my_profile' %}class="active"{% endif %}>
    <i class="fas fa-user"></i><span>My</span>
  </a>
</nav>

{% block extra_js %}{% endblock %}
</body>
</html>
